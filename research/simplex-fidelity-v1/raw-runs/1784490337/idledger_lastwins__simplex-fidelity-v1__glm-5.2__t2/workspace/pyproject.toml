[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idledger"
version = "0.1.0"
description = "An idempotent, thread-safe ledger of integer-cent account balances."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["idledger*"]